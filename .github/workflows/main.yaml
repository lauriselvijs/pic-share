name: Main

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/pic-share:prod_${{ env.COMMIT_HASH }} -f Dockerfile.prod .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/pic-share:prod_${{ env.COMMIT_HASH }}

      - name: Pull image with commit hash
        run: docker pull ghcr.io/${{ github.repository_owner }}/pic-share:prod_${{ env.COMMIT_HASH }}

      - name: Retag image as prod
        run: docker tag ghcr.io/${{ github.repository_owner }}/pic-share:prod_${{ env.COMMIT_HASH }} ghcr.io/${{ github.repository_owner }}/pic-share:prod

      - name: Inject .env from secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run docker-compose
        run: docker-compose -f docker-compose.prod.yaml up -d

      - name: Feature test
        run: docker-compose -f docker-compose.prod.yaml exec app ./vendor/bin/sail test --coverage

      - name: E2E test
        run: docker-compose -f docker-compose.prod.yaml exec app ./vendor/bin/sail dusk

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/Browser/screenshots

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console
          path: tests/Browser/console

      - name: Shut down docker-compose
        if: always()
        run: docker-compose -f docker-compose.prod.yaml down
