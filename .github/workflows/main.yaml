name: Main

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]

env:
  TEST_DB: testing
  TEST_URL: http://laravel.test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/pic-share:prod -f Dockerfile.prod .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/pic-share:prod

