on:
  push:
    branches: [main, 1.x]
  pull_request:
    branches: [main, 1.x]
env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/pic-share-app:test
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/pic-share-nginx:test
jobs:
  build:
    runs-on: ubuntu-latest
    name: Verify Docker Image Builds and Push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app test image
        run: |
          docker build -t $APP_IMAGE -f docker/production/app/Dockerfile .
          docker push $APP_IMAGE

      - name: Build and push nginx test image
        run: |
          docker build -t $NGINX_IMAGE -f docker/production/nginx/Dockerfile .
          docker push $NGINX_IMAGE

  test:
    runs-on: ubuntu-latest
    needs: build
    name: Run Tests with Pulled Test Images

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test images
        run: |
          docker pull $APP_IMAGE
          docker pull $NGINX_IMAGE

      - name: Inject .env from secret
        run: |
          cat <<EOF > .env
          ${{ secrets.ENV_TESTING }}
          EOF

      - name: Start docker containers
        run: docker compose -f docker-compose.test.yaml up -d

      - name: Tests
        run: docker compose exec -T app php artisan test

      - name: E2E Tests
        run: docker compose exec -T app php artisan dusk

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/Browser/screenshots

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console
          path: tests/Browser/console

      - name: Shut down containers
        if: always()
        run: docker compose -f docker-compose.test.yaml down

  pre-build:
    runs-on: ubuntu-latest
    needs: test
    name: Build and Push Final Production Image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/pic-share:${{ env.COMMIT_HASH }} -f Dockerfile.prod .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/pic-share:${{ env.COMMIT_HASH }}

      - name: Cleanup registry
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository_owner }}/pic-share
          package-type: container
          min-versions-to-keep: 5
